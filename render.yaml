services:
  - type: web
    name: loksutra-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FFPROBE_PATH
        value: /usr/bin/ffprobe
      - key: GNANI_BATCH_ENABLED
        value: "false"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: GNANI_API_KEY
        sync: false
